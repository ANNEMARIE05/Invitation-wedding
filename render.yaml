services:
  - type: web
    name: invitation-wedding-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Base PostgreSQL persistante (Neon, Supabase, Render Postgres…) — à renseigner dans le dashboard Render.
      # Sans elle, SQLite est utilisé : sur le plan gratuit, le disque est effacé à chaque redémarrage
      # (RSVP, liens d'invitation et livre d'or perdus).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: ./data/wedding.db
      - key: ALLOWED_ORIGINS
        value: https://invitation-wedding-eta.vercel.app,https://stephane-et-marie.site,https://www.stephane-et-marie.site
      - key: COUPLE_PASSWORD
        value: Hesed-MS-13
